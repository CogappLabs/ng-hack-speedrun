<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Drive</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f27; overflow: hidden; font: 13px system-ui, sans-serif; color: #ddd; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud { position: fixed; top: 8px; left: 8px; background: #000a; padding: 6px 10px; border-radius: 4px; pointer-events: none; }
  #tip { position: fixed; background: #000c; padding: 4px 8px; border-radius: 4px; pointer-events: none; display: none; max-width: 320px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud"><div id="hudStatus">Loading…</div><div id="hudLocation"></div><div style="opacity:.6">Arrow keys to drive · scroll to move the camera closer or further · drag to look around</div></div>
<div id="tip"></div>
<script type="module">
import * as THREE from 'three';

// The game logic runs on a flat 2D plane (x east, y south), the same as the 2D version.
// For Three.js, world (x, y) maps to 3D (x, 0, y): the ground is the XZ plane and Y points up.
const CELL = 256;          // world units per grid cell
const PAD = 8;             // gap inside each cell so tiles never touch
const CONCURRENCY = 16;    // parallel image downloads
const TEX_RADIUS = 22;     // cells: tiles closer than this to the car get a GPU texture
const TEX_KEEP = 28;       // cells: textures further than this are freed
const TEX_PER_FRAME = 8;   // texture uploads allowed per frame (keeps frame times smooth)
const TEX_MAX_PX = 512;    // longest side of an uploaded texture
const SKY = 0x1b1f27;

const hudStatus = document.getElementById('hudStatus');
const hudLocation = document.getElementById('hudLocation');
const tip = document.getElementById('tip');

let layout, tiles = [], byCell = new Map(), loaded = 0;

// --- Car physics (unchanged from the 2D version) -------------------------------
// Simple arcade model: heading + scalar speed, steering scaled by speed so the
// car can't spin on the spot. Units are world units (CELL = one grid cell).
const CAR = {
  length: 96, width: 52,
  accel: 900,          // u/s² when holding Up
  brake: 1800,         // u/s² when holding Down while moving forward
  reverseMax: 350,     // u/s
  maxSpeed: 1100,      // u/s (~4 cells/s)
  drag: 1.2,           // proportional slowdown per second when coasting
  turnRate: 2.6,       // rad/s at full steering authority
};
const car = { x: 0, y: 0, heading: -Math.PI / 2, speed: 0, steer: 0 };  // heading 0 = east, -π/2 = north
const keys = new Set();

addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) { keys.add(e.key); chase.orbitReturn = true; e.preventDefault(); }
});
addEventListener('keyup', e => keys.delete(e.key));
addEventListener('blur', () => keys.clear());

function updateCar(dt) {
  const up = keys.has('ArrowUp'), down = keys.has('ArrowDown');
  const steer = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
  car.steer = steer;

  if (up) car.speed += CAR.accel * dt;
  if (down) car.speed -= (car.speed > 0 ? CAR.brake : CAR.accel) * dt;
  if (!up && !down) {
    car.speed -= car.speed * CAR.drag * dt;
    if (Math.abs(car.speed) < 5) car.speed = 0;
  }
  car.speed = Math.max(-CAR.reverseMax, Math.min(CAR.maxSpeed, car.speed));

  // Steering authority ramps up with speed; reversing flips the turn direction like a real car.
  const authority = Math.min(1, Math.abs(car.speed) / 300) * Math.sign(car.speed);
  car.heading += steer * CAR.turnRate * authority * dt;

  car.x += Math.cos(car.heading) * car.speed * dt;
  car.y += Math.sin(car.heading) * car.speed * dt;

  // Keep the car within the grid's bounds.
  car.x = Math.max(0, Math.min(layout.cols * CELL, car.x));
  car.y = Math.max(0, Math.min(layout.rows * CELL, car.y));
}

const tileAt = (x, y) => byCell.get(Math.floor(x / CELL) + ',' + Math.floor(y / CELL));
let lastTileId;
function updateHud() {
  const t = tileAt(car.x, car.y);
  if (t?.id === lastTileId) return;
  lastTileId = t?.id;
  hudLocation.textContent = t ? `On: ${t.title} (${t.acc})` : 'Off-road — in a gap';
}

// --- Scene -----------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());  // keeps low-angle tiles sharp

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, CELL * 10, CELL * 20);
const camera = new THREE.PerspectiveCamera(60, 1, 5, CELL * 24);

scene.add(new THREE.HemisphereLight(0xdde6ff, 0x30302a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-1, 2, -0.6);
scene.add(sun);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// Tiles: one flat quad per artwork. All quads share one geometry; size comes from mesh.scale.
const tileGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const placeholderMat = new THREE.MeshBasicMaterial({ color: 0x3a3a3a });
const inner = CELL - PAD * 2;

function buildTiles() {
  const group = new THREE.Group();
  for (const t of tiles) {
    const m = new THREE.Mesh(tileGeo, placeholderMat);
    m.position.set((t.col + 0.5) * CELL, 0, (t.row + 0.5) * CELL);
    m.scale.set(inner, 1, inner);
    m.matrixAutoUpdate = false;
    m.updateMatrix();
    t.mesh = m;
    group.add(m);
  }
  scene.add(group);

  // Dark ground under the gaps, with faint cell lines so you can sense speed off-road.
  const W = layout.cols * CELL, H = layout.rows * CELL;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + CELL * 40, H + CELL * 40).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x0d0f13 }));
  ground.position.set(W / 2, -2, H / 2);
  scene.add(ground);
  const size = Math.max(layout.cols, layout.rows);
  const grid = new THREE.GridHelper(size * CELL, size, 0x262b35, 0x262b35);
  grid.position.set(size * CELL / 2, -1, size * CELL / 2);
  scene.add(grid);
}

// Fit the whole artwork inside its square cell, centred (letterboxed), as in the 2D version.
function fitTile(t) {
  const s = Math.min(inner / t.img.width, inner / t.img.height);
  t.mesh.scale.set(t.img.width * s, 1, t.img.height * s);
  t.mesh.updateMatrix();
}

function makeTexture(img) {
  const s = Math.min(1, TEX_MAX_PX / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s);
  c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  return tex;
}

// Only tiles near the car hold a texture; all 2,400 at once would use too much GPU memory.
function manageTextures() {
  const cc = car.x / CELL, cr = car.y / CELL;
  let budget = TEX_PER_FRAME;
  const want = [];
  for (const t of tiles) {
    if (!t.img) continue;
    const d = Math.hypot(t.col + 0.5 - cc, t.row + 0.5 - cr);
    if (t.tex && d > TEX_KEEP) {
      t.mesh.material = placeholderMat;
      t.mat.dispose(); t.tex.dispose();
      t.tex = t.mat = null;
    } else if (!t.tex && d < TEX_RADIUS) want.push([d, t]);
  }
  want.sort((a, b) => a[0] - b[0]);
  for (const [, t] of want) {
    if (!budget--) break;
    t.tex = makeTexture(t.img);
    t.mat = new THREE.MeshBasicMaterial({ map: t.tex });
    t.mesh.material = t.mat;
  }
}

// --- Car model -------------------------------------------------------------------
// Built facing +X so that rotation.y = -heading lines it up with the 2D heading.
function buildCar() {
  const { length: L, width: W } = CAR;
  const g = new THREE.Group();
  const body = new THREE.Group();  // tilts with steering; the wheels and shadow stay put
  const paint = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.4, metalness: 0.2 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1d2a35, roughness: 0.1, metalness: 0.6 });
  const light = new THREE.MeshBasicMaterial({ color: 0xffd166 });
  const tail = new THREE.MeshBasicMaterial({ color: 0xff2a2a });
  const tyre = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

  const chassis = new THREE.Mesh(new THREE.BoxGeometry(L, 22, W), paint);
  chassis.position.y = 22;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(L * 0.5, 20, W * 0.86), glass);
  cabin.position.set(-L * 0.06, 43, 0);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(L * 0.42, 4, W * 0.8), paint);
  roof.position.set(-L * 0.08, 54, 0);
  body.add(chassis, cabin, roof);
  for (const z of [-W * 0.32, W * 0.32]) {
    const head = new THREE.Mesh(new THREE.BoxGeometry(2, 7, 11), light);
    head.position.set(L / 2 + 1, 25, z);
    const rear = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 11), tail);
    rear.position.set(-L / 2 - 1, 25, z);
    body.add(head, rear);
  }
  g.add(body);

  const wheelGeo = new THREE.CylinderGeometry(13, 13, 10, 18).rotateX(Math.PI / 2);
  const wheels = [];
  for (const [x, z] of [[L * 0.3, -W / 2], [L * 0.3, W / 2], [-L * 0.3, -W / 2], [-L * 0.3, W / 2]]) {
    const w = new THREE.Mesh(wheelGeo, tyre);
    w.position.set(x, 13, z);
    wheels.push(w);
    g.add(w);
  }

  // Soft blob shadow so the car reads as sitting on the paintings.
  const sc = document.createElement('canvas');
  sc.width = sc.height = 64;
  const sx = sc.getContext('2d');
  const grad = sx.createRadialGradient(32, 32, 4, 32, 32, 32);
  grad.addColorStop(0, 'rgba(0,0,0,0.6)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  sx.fillStyle = grad;
  sx.fillRect(0, 0, 64, 64);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(L * 1.4, W * 1.6).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.position.y = 1;
  g.add(shadow);

  scene.add(g);
  return { group: g, body, wheels };
}
let carModel;

function syncCarModel(dt) {
  const { group, body, wheels } = carModel;
  group.position.set(car.x, 0, car.y);
  group.rotation.y = -car.heading;
  // Lean out of corners a little, proportional to how hard we're turning.
  const lean = -car.steer * Math.min(1, Math.abs(car.speed) / CAR.maxSpeed) * 0.06;
  body.rotation.x += (lean - body.rotation.x) * Math.min(1, dt * 8);
  const spin = (car.speed * dt) / 13;
  for (let i = 0; i < 4; i++) {
    wheels[i].rotation.z -= spin;
    if (i < 2) wheels[i].rotation.y = -car.steer * 0.35;  // front wheels turn
  }
}

// --- Chase camera ----------------------------------------------------------------
// Sits behind and above the car and swings round after it with a little lag.
// Dragging orbits the camera around the car; pressing an arrow key swings it back.
const chase = {
  dist: 420,            // distance behind the car (scroll to change)
  heightRatio: 0.42,    // height as a fraction of distance
  lookAhead: 160,       // aim this far in front of the car
  yaw: car.heading,     // smoothed camera heading
  orbit: 0,             // extra yaw from dragging
  orbitReturn: true,
};

function updateCamera(dt, snap = false) {
  const k = snap ? 1 : 1 - Math.exp(-dt * 4);
  let diff = car.heading - chase.yaw;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  chase.yaw += diff * k;
  if (chase.orbitReturn) chase.orbit *= Math.exp(-dt * 3);
  const yaw = chase.yaw + chase.orbit;
  const fx = Math.cos(yaw), fz = Math.sin(yaw);
  camera.position.set(car.x - fx * chase.dist, chase.dist * chase.heightRatio, car.y - fz * chase.dist);
  camera.lookAt(car.x + fx * chase.lookAhead, 20, car.y + fz * chase.lookAhead);
  // Pull the fog in when the camera is close so the horizon stays hidden.
  scene.fog.near = CELL * 8 + chase.dist;
  scene.fog.far = CELL * 18 + chase.dist * 2;
  camera.far = scene.fog.far + CELL;
  camera.updateProjectionMatrix();
}

// --- Image loading ---------------------------------------------------------------
// Download all images with bounded concurrency, nearest to the car first.
async function loadAll() {
  const dist = t => (t.col * CELL - car.x) ** 2 + (t.row * CELL - car.y) ** 2;
  const queue = [...tiles].sort((p, q) => dist(p) - dist(q));
  async function worker() {
    while (queue.length) {
      const t = queue.shift();
      const img = new Image();
      img.crossOrigin = 'anonymous';  // needed for WebGL textures (server sends CORS headers)
      img.decoding = 'async';
      img.src = t.url;
      try { await img.decode(); t.img = img; fitTile(t); } catch { t.failed = true; }
      loaded++;
      hudStatus.textContent = `${tiles.length} artworks · ${layout.cols}×${layout.rows} grid · loaded ${loaded}/${tiles.length}`;
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  hudStatus.textContent = `${tiles.length} artworks · ${layout.cols}×${layout.rows} grid`;
}

// --- Mouse: drag to orbit, scroll to change distance, hover for titles -------------
let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX };
  chase.orbitReturn = false;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); });

const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2(), hit = new THREE.Vector3();
canvas.addEventListener('pointermove', e => {
  if (drag) {
    chase.orbit += (e.clientX - drag.x) * 0.006;
    drag.x = e.clientX;
  }
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const t = !drag && raycaster.ray.intersectPlane(groundPlane, hit) && tileAt(hit.x, hit.z);
  if (t) {
    tip.style.display = 'block';
    tip.style.left = e.clientX + 14 + 'px';
    tip.style.top = e.clientY + 14 + 'px';
    tip.textContent = `${t.title} (${t.acc})`;
  } else tip.style.display = 'none';
});
canvas.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  chase.dist = Math.min(2400, Math.max(160, chase.dist * Math.exp(e.deltaY * 0.0015)));
}, { passive: false });

// --- Main loop -------------------------------------------------------------------
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);  // clamp so a background tab doesn't teleport the car
  lastT = now;
  if (keys.size || car.speed) {
    updateCar(dt);
    updateHud();
  }
  syncCarModel(dt);
  updateCamera(dt);
  manageTextures();
  renderer.render(scene, camera);
}

(async () => {
  layout = await (await fetch('layout.json')).json();
  tiles = layout.tiles;
  for (const t of tiles) byCell.set(t.col + ',' + t.row, t);
  resize();
  buildTiles();
  carModel = buildCar();
  // Start the car on the tile nearest the centroid of all tiles.
  const mc = tiles.reduce((s, t) => s + t.col, 0) / tiles.length;
  const mr = tiles.reduce((s, t) => s + t.row, 0) / tiles.length;
  const start = tiles.reduce((best, t) =>
    (t.col - mc) ** 2 + (t.row - mr) ** 2 < (best.col - mc) ** 2 + (best.row - mr) ** 2 ? t : best);
  car.x = (start.col + 0.5) * CELL;
  car.y = (start.row + 0.5) * CELL;
  chase.yaw = car.heading;
  syncCarModel(0);
  updateCamera(0, true);
  updateHud();
  requestAnimationFrame(frame);
  loadAll();
})();
</script>
</body>
</html>
